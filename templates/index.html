<!DOCTYPE html>

<html>

<head>

    <title>
        AI Patient Readmission Prediction
    </title>

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>


<div class="container mt-5">

    <div class="card shadow p-4">

        <h2 class="text-center mb-4">

            AI-Based Patient
            Readmission Prediction

        </h2>


        <form
            action="/predict"
            method="POST"
        >


            <label>
                Age
            </label>

            <input
                type="number"
                name="age"
                class="form-control"
                required
            >


            <label class="mt-3">
                Gender
            </label>

            <select
                name="gender"
                class="form-control"
                required
            >

                <option value="Male">
                    Male
                </option>

                <option value="Female">
                    Female
                </option>

            </select>


            <label class="mt-3">
                Diabetes
            </label>

            <select
                name="diabetes"
                class="form-control"
            >

                <option value="0">
                    No
                </option>

                <option value="1">
                    Yes
                </option>

            </select>


            <label class="mt-3">
                Hypertension
            </label>

            <select
                name="hypertension"
                class="form-control"
            >

                <option value="0">
                    No
                </option>

                <option value="1">
                    Yes
                </option>

            </select>


            <label class="mt-3">
                Heart Disease
            </label>

            <select
                name="heart_disease"
                class="form-control"
            >

                <option value="0">
                    No
                </option>

                <option value="1">
                    Yes
                </option>

            </select>


            <label class="mt-3">
                Previous Admissions
            </label>

            <input
                type="number"
                name="previous_admissions"
                class="form-control"
                min="0"
                required
            >


            <label class="mt-3">
                Length of Stay
            </label>

            <input
                type="number"
                name="stay"
                class="form-control"
                min="1"
                required
            >


            <label class="mt-3">
                BMI
            </label>

            <input
                type="number"
                step="0.1"
                name="bmi"
                class="form-control"
                required
            >


            <button
                type="submit"
                class="btn btn-primary w-100 mt-4"
            >

                Predict Readmission Risk

            </button>


        </form>
        <a href="/search" class="btn btn-primary w-100 mt-3">
            Search Patient
        </a>
        </a>
        <a href="/history" class="history-button">
           📋 View Prediction History
        </a>

    </div>

</div>


</body>

</html>
