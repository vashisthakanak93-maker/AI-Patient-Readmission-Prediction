<!DOCTYPE html>

<html>

<head>

    <title>
        Prediction Result
    </title>

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    >

</head>


<body>


<div class="container mt-5">

    <div class="card shadow p-5 text-center">


        <h1>
            Prediction Result
        </h1>


        {% if result == "High Risk" %}

            <div class="alert alert-danger mt-4">

                <h3>
                    High Readmission Risk
                </h3>

                <p>
                    The patient has a higher
                    predicted risk of readmission.
                </p>

            </div>

        {% else %}

            <div class="alert alert-success mt-4">

                <h3>
                    Low Readmission Risk
                </h3>

                <p>
                    The patient has a lower
                    predicted risk of readmission.
                </p>

            </div>

        {% endif %}


        <h4 class="mt-3">

            Probability:
            {{ probability }}%

        </h4>


        <a
            href="/"
            class="btn btn-primary mt-4"
        >

            Predict Another Patient

        </a>


    </div>

</div>


</body>

</html>
